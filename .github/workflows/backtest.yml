name: Backtest BOS CHoCH

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas

      - name: Uruchom backtest
        run: python backtest.py > wyniki.txt 2>&1 || true

      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add wyniki.txt
          git commit -m "Wyniki backtestu" || echo "brak zmian"
            git pull --rebase origin main || true
          git push
